name: Publish Loveometro

# Publication is manual so pushing code never republishes an offline site.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore publication media from the repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .local
          gh release download site-media --pattern site-media.tar.gz --dir .local --repo "$GITHUB_REPOSITORY"
          tar -xzf .local/site-media.tar.gz

      - name: Verify required media
        run: npm run check:media

      - name: Test the anniversary flow
        run: npm test

      - name: Build the website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
